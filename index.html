        <button class="nav-link" type="button" data-route="dashboard">

        <button class="nav-link" type="button" data-route="cashier">

        </button>

        <p class="nav-label">Manajemen</p>
        <button class="nav-link" type="button" data-route="products">

        <button class="nav-link" type="button" data-route="inventory">

        </button>
        <button class="nav-link" type="button" data-route="transactions">

        </button>
        <button class="nav-link" type="button" data-route="reports">
          <svg class="icon"><use href="#i-chart"></use></svg><span>Laporan</span>
        </button>

        <p class="nav-label">Sistem</p>
        <button class="nav-link" type="button" data-route="settings">
          <svg class="icon"><use href="#i-settings"></use></svg><span>Pengaturan</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-note">
          <svg class="icon"><use href="#i-database"></use></svg>
          <div>
            <strong>Data lokal</strong>
            <span>Tersimpan di browser ini</span>
          </div>
        </div>
        <p class="sidebar-version">UsahaPOS v1.0</p>

    <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Tutup menu" tabindex="-1"></button>

    <div class="app-main">
      <header class="topbar">

        </button>
        <div class="topbar-heading">

          <p id="page-subtitle">Ringkasan kondisi usaha</p>
        </div>
        <div class="topbar-actions">
          <div class="topbar-date" id="topbar-date">
            <svg class="icon"><use href="#i-calendar"></use></svg>
            <span id="topbar-date-text">—</span>
          </div>
          <button class="business-chip" id="business-chip" type="button" title="Buka pengaturan usaha">
            <span class="business-avatar" id="business-initials">UP</span>
            <span class="business-copy">
              <strong id="business-name">UsahaPOS</strong>
              <small id="business-owner">Pemilik usaha</small>
            </span>
            <svg class="icon business-chip-chevron"><use href="#i-chevron-right"></use></svg>
          </button>
        </div>
      </header>

      <main class="page-content" id="page-content" tabindex="-1">
        <div class="boot-loading">
          <span class="spinner" aria-hidden="true"></span>
          <p>Menyiapkan UsahaPOS…</p>
        </div>

    </div>
